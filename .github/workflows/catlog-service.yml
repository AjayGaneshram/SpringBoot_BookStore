name: Catlog Service

on:
  push:
    paths:
      - catlog-services/**
    branches:
      - '**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ensure mvnw is executable
        run: chmod +x ./mvnw

      - name: Build with Maven Wrapper (catlog-services module only)
        run: ./mvnw -ntp -pl catlog-services verify
